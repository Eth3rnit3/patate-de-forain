# Relais en ligne de Patate de Forain sur Cloudflare Workers (offre gratuite).
# Déploiement : voir README.md.
name = "patate-relais"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "SALONS"
class_name = "Salon"

# Les Durable Objects de l'offre gratuite sont ceux à stockage SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Salon"]

[vars]
# Pages autorisées, séparées par des virgules (vide : toutes). Les clients
# sans en-tête Origin (version PC, éditeur) passent toujours.
ORIGINES = "https://eth3rnit3.github.io,http://localhost:8000,http://localhost:8765,http://localhost:8799"
